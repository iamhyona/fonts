<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SPECIMEN</title>
<meta name="description" content="Google · Adobe · 한글 무료폰트를 한 곳에서 찾고 분류·시대별로 보고 즐겨찾기하는 폰트 아카이브">
<meta property="og:title" content="SPECIMEN">
<meta property="og:description" content="폰트를 한 곳에서 — 분류 · 시대 · 즐겨찾기">
<meta property="og:image" content="https://iamhyona.github.io/fonts/og.png">
<meta name="theme-color" content="#0d0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SPECIMEN">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300..800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d0f;--bg2:#141417;--card:#17171b;--card2:#1d1d22;--line:#2a2a30;--line2:#222227;
  --tx:#f2f2f4;--tx2:#a4a4ad;--tx3:#6c6c75;--acc:#3b82f6;--grn:#34d399;--gold:#fbbf24;--red:#f87171;
  --r:14px;--hdr:56px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:'Asta Sans',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.45}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
header{position:sticky;top:0;z-index:30;background:rgba(13,13,15,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hbar{height:var(--hdr);display:flex;align-items:center;gap:10px;padding:0 16px;max-width:1600px;margin:0 auto}
.logo{font-family:'DM Mono',monospace;font-weight:500;font-size:16px;letter-spacing:.06em}
.logo small{font-size:10px;color:var(--tx3);margin-left:6px;letter-spacing:.04em}
.hsp{flex:1}
.rbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--tx2);position:relative}
.rbtn:hover{color:var(--tx);border-color:#3a3a42}
.rbtn .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--gold);display:none}
.rbtn.pending .dot{display:block}
.rbtn.spin svg{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
nav.tabs{display:flex;gap:4px;padding:0 16px 8px;max-width:1600px;margin:0 auto}
nav.tabs button{padding:7px 14px;border-radius:999px;color:var(--tx2);font-weight:600;font-size:13px;letter-spacing:.02em}
nav.tabs button.on{background:var(--tx);color:#0d0d0f}
nav.tabs .cnt{font-family:'DM Mono',monospace;font-size:11px;opacity:.6;margin-left:4px}

main{max-width:1600px;margin:0 auto;padding:14px 16px 120px}

/* tool bar */
.tools{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;align-items:center}
.fld{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px;min-width:0}
.fld input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:14px}
.fld input::placeholder{color:var(--tx3)}
.fld svg{color:var(--tx3)}
.fld .x{color:var(--tx3);display:none}
.fld.has .x{display:block}
.szw{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px}
.szw input[type=range]{width:110px;accent-color:var(--tx)}
.szw span{font-family:'DM Mono',monospace;font-size:12px;color:var(--tx2);width:30px;text-align:right}
.vbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--tx3)}
.vbtn.on{color:var(--tx);background:var(--card2)}

.chipsrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0;margin-top:10px;align-items:center}
.chipsrow::-webkit-scrollbar{display:none}
.chipsrow .lbl{font-size:11px;color:var(--tx3);font-family:'DM Mono',monospace;letter-spacing:.06em;flex:none;width:44px}
.chip{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--tx2);font-size:13px;white-space:nowrap;background:transparent}
.chip:hover{color:var(--tx)}
.chip.on{background:var(--tx);color:#0d0d0f;border-color:var(--tx);font-weight:600}
.chip .n{font-family:'DM Mono',monospace;font-size:10.5px;opacity:.55;margin-left:4px}
.chip.sub{font-size:12px;padding:5px 10px}
.chip.sub.on{background:#e5e7eb}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.seg button{padding:5px 12px;border-radius:999px;font-size:13px;color:var(--tx2);white-space:nowrap}
.seg button.on{background:var(--card2);color:var(--tx);font-weight:600}
.src-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.sg{background:#60a5fa}.sa{background:#f87171}.sk{background:#34d399}

.meta-row{display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px;gap:10px}
.meta-row .count{color:var(--tx2);font-size:13px}
.meta-row .count b{color:var(--tx);font-family:'DM Mono',monospace;font-weight:500}
.meta-row select{background:var(--card);border:1px solid var(--line);border-radius:10px;height:34px;padding:0 10px;color:var(--tx2);font-size:13px}
.linkbtn{color:var(--tx2);font-size:13px;display:inline-flex;gap:4px;align-items:center}
.linkbtn:hover{color:var(--tx)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.grid.list{grid-template-columns:1fr}
.card{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);padding:14px 16px 12px;display:flex;flex-direction:column;gap:10px;min-width:0;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:#34343c}
.card .top{display:flex;align-items:flex-start;gap:8px}
.card .nm{font-weight:600;font-size:14px;line-height:1.3;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .sub2{font-size:12px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--tx3);flex:none;margin:-4px -6px 0 0}
.star:hover{color:var(--tx)}
.star.on{color:var(--gold)}
.star.on svg{fill:var(--gold)}
.pv{font-size:var(--pvs,40px);line-height:1.18;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere;min-height:1.2em;max-height:calc(var(--pvs,40px)*2.45);color:var(--tx)}
.grid.list .pv{max-height:calc(var(--pvs,40px)*1.25);white-space:nowrap;text-overflow:ellipsis}
.pv.loading{opacity:.25}
.pv.nopv{font-family:'Asta Sans',sans-serif!important;color:var(--tx3);font-size:13px;display:flex;align-items:center;gap:8px;min-height:calc(var(--pvs,40px)*1.2);max-height:none}
.pv.nopv .ph{flex:1;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;line-height:1.5}
.tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tg{font-size:11px;color:var(--tx2);background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:2px 7px;white-space:nowrap}
.tg.era{color:var(--tx)}
.tg.mono{font-family:'DM Mono',monospace;font-size:10.5px}
.more{display:flex;justify-content:center;padding:26px}
.empty{color:var(--tx3);text-align:center;padding:60px 20px;line-height:1.8}

/* era view */
.eras{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:16px}
.erac{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:104px;position:relative;overflow:hidden}
.erac.on{border-color:var(--tx)}
.erac .yr{font-family:'DM Mono',monospace;font-size:11px;color:var(--tx3)}
.erac .t{font-weight:700;font-size:15px}
.erac .st{font-size:11.5px;color:var(--tx2);line-height:1.4}
.erac .c{position:absolute;right:12px;top:10px;font-family:'DM Mono',monospace;font-size:11px;color:var(--tx3)}
.erac .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--tx2);opacity:.5}
.timeline{display:flex;align-items:center;gap:0;margin:4px 0 14px;overflow-x:auto;scrollbar-width:none}
.notice{font-size:12px;color:var(--tx3);margin:16px 0 12px;line-height:1.6}

/* favorites */
.favtop{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.fsec{margin-top:22px}
.fsec h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.fsec h3 .n{font-family:'DM Mono',monospace;font-size:11px;color:var(--tx3);font-weight:400}
.fsec h3 .act{margin-left:auto;display:flex;gap:4px}
.fsec h4{font-size:12px;color:var(--tx3);font-weight:500;margin:14px 0 8px;letter-spacing:.02em}
.ib{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--tx3)}
.ib:hover{color:var(--tx);background:var(--card)}
.memo{font-size:12px;color:var(--tx2);background:var(--bg2);border-radius:8px;padding:6px 9px;line-height:1.5}

/* sheet / modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
@media(min-width:760px){.ov{align-items:center}}
.sheet{background:var(--bg2);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:880px;max-height:92vh;overflow:auto;padding:18px 18px calc(22px + env(safe-area-inset-bottom))}
@media(min-width:760px){.sheet{border-radius:20px;max-height:88vh}}
.sheet.sm{max-width:440px}
.shh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.shh h2{font-size:18px;font-weight:700;flex:1;min-width:0}
.shh .ttl2{font-size:12px;color:var(--tx3);font-weight:400;display:block;margin-top:2px}
.dpv{font-size:56px;line-height:1.15;word-break:keep-all;overflow-wrap:anywhere;padding:18px 0;border-bottom:1px solid var(--line);margin-bottom:12px}
.wts{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.wts div{font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 0;border-bottom:1px solid var(--line2)}
.wts div small{font-family:'DM Mono',monospace;font-size:10px;color:var(--tx3);display:inline-block;width:34px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:0;font-size:13px}
.kv>div{padding:9px 0;border-bottom:1px solid var(--line2)}
.kv>div:nth-child(odd){color:var(--tx3)}
.desc{font-size:13px;color:var(--tx2);line-height:1.7;margin:12px 0}
.lic{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin:6px 0}
.lic div{background:var(--card);border-radius:9px;padding:8px 10px;font-size:12px}
.lic div b{display:block;font-weight:600;font-size:12px;margin-top:2px}
.ok{color:var(--grn)}.cond{color:var(--gold)}.no{color:var(--red)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{height:40px;padding:0 16px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
.btn.pri{background:var(--tx);color:#0d0d0f;border-color:var(--tx)}
.btn:disabled{opacity:.4}
.flist{display:flex;flex-direction:column;gap:2px;margin:6px 0 10px}
.flist label{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line2);cursor:pointer}
.flist input{width:18px;height:18px;accent-color:var(--tx)}
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;height:40px;padding:0 12px;outline:0}
textarea.inp{height:70px;padding:10px 12px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.lab{font-size:12px;color:var(--tx3);margin:14px 0 6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--tx);color:#0d0d0f;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:90;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
.loadingx{color:var(--tx3);padding:80px 0;text-align:center}
.hint{font-size:12px;color:var(--tx3);line-height:1.6}
.sw{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line2);gap:10px}
.sw input{width:18px;height:18px;accent-color:var(--tx)}

@media(max-width:820px){
  .tools{grid-template-columns:1fr 1fr}
  .tools .sample{grid-column:1/-1;order:-1}
  .szw input[type=range]{width:70px}
  .grid{grid-template-columns:1fr}
  .dpv{font-size:40px}
}
@media(max-width:520px){
  .hbar{gap:7px;padding:0 12px}
  .logo small{display:none}
  main{padding:12px 12px 120px}
  nav.tabs{padding:0 12px 8px}
  .tools{grid-template-columns:1fr auto}
  .szw{padding:0 8px}
  .szw input[type=range]{width:64px}
  .chipsrow .lbl{width:36px}
}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="logo">SPECIMEN<small>FONT ARCHIVE</small></div>
    <div class="hsp"></div>
    <button class="rbtn" id="bSync" title="동기화"><span class="dot"></span><svg class="i" viewBox="0 0 24 24"><path d="M4 8h14l-3.5-3.5"/><path d="M20 16H6l3.5 3.5"/></svg></button>
    <a class="rbtn" id="bSheet" title="즐겨찾기 시트 열기" target="_blank" rel="noopener"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M3.5 14.5h17M9.5 4.5v15"/></svg></a>
    <button class="rbtn" id="bSet" title="설정"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <nav class="tabs" id="tabs">
    <button data-t="browse" class="on">BROWSE</button>
    <button data-t="era">ERA</button>
    <button data-t="saved">SAVED<span class="cnt" id="favCnt">0</span></button>
  </nav>
</header>

<main>
  <section id="toolArea">
    <div class="tools">
      <div class="fld" id="fQ"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><input id="q" placeholder="폰트 · 디자이너 · 제작사 검색" autocomplete="off"><button class="x" data-clear="q"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <div class="fld sample" id="fS"><svg class="i" viewBox="0 0 24 24"><path d="M5 19 10.5 5h1L17 19M7.2 14h8.6"/><path d="M19 9v10"/></svg><input id="sample" placeholder="샘플 텍스트 입력 — 전체 미리보기에 적용" autocomplete="off"><button class="x" data-clear="sample"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <div class="szw"><svg class="i" viewBox="0 0 24 24" style="color:var(--tx3)"><path d="M4 18 8 7h1l4 11M5.4 14.5h6.2"/><path d="M15 18l2.6-6.5h.8L21 18M15.9 16h4.2"/></svg><input type="range" id="size" min="16" max="120" value="40"><span id="sizeV">40</span></div>
    </div>
    <div id="filters"></div>
  </section>
  <section id="eraArea" style="display:none"></section>
  <section id="favTop" style="display:none"></section>
  <div class="meta-row" id="metaRow">
    <div class="count" id="count"></div>
    <div class="row">
      <select id="sort"><option value="rel">기본순</option><option value="name">이름순</option><option value="new">최근 추가순</option><option value="era">시대순</option><option value="pop">인기순(눈누)</option><option value="wt">굵기 많은순</option></select>
      <button class="vbtn on" data-v="grid" title="그리드"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button>
      <button class="vbtn" data-v="list" title="리스트"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    </div>
  </div>
  <div id="out"><div class="loadingx">폰트 목록 불러오는 중…</div></div>
</main>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ---------- constants ---------- */
const MAJOR={serif:'세리프',sans:'산세리프',slab:'슬랩',script:'스크립트',hand:'손글씨',display:'디스플레이',mono:'모노',black:'블랙레터',
  kgothic:'한글 고딕',kmyung:'한글 명조',khand:'한글 손글씨',kdisplay:'한글 디스플레이'};
const MAJOR_ORDER=['kgothic','kmyung','khand','kdisplay','serif','sans','slab','script','hand','display','mono','black'];
const SUB={venetian:'휴머니스트(베네치안)',garalde:'올드스타일(가랄드)',transitional:'트랜지셔널',didone:'디돈·모던',scotch:'스카치',fatface:'팻페이스',glyphic:'글리픽',wedge:'웨지',softserif:'소프트',contemporary:'컨템퍼러리',
  grotesque:'그로테스크',neogrotesque:'네오그로테스크',geometric:'지오메트릭',humanist:'휴머니스트',rounded:'라운드',superellipse:'슈퍼엘립스',condensed:'컨덴스드',
  clarendon:'클라렌돈',geoslab:'지오메트릭 슬랩',humslab:'휴머니스트 슬랩',typewriter:'타자기',
  formal:'포멀',informal:'캐주얼',upright:'업라이트',brush:'브러시',handwritten:'손글씨체',calligraphy:'캘리그래피',

/* ---------- load ---------- */
async function load(){
  try{
    const r=await fetch('fonts.json?v=1792935928'); const j=await r.json();
    S.data=j.fonts; S.akits=j.akits||[]; S.data.forEach((f,i)=>{f._i=i; S.byId[f.id]=f; if(f.s==='a'&&f.fw){ f._w=f.fw; } if(f.s==='g'){ f._w=(f.wt&&f.wt.length)?f.wt.reduce((a,b)=>Math.abs(b-400)<Math.abs(a-400)?b:a):400; } f._q=(f.n+' '+(f.k||'')+' '+(f.d||'')+' '+(f.fo||'')+' '+(f.tg||[]).join(' ')).toLowerCase();});
  }catch(e){ $('#out').innerHTML='<div class="empty">폰트 데이터를 불러오지 못했어요.<br>새로고침 해주세요.</div>'; return; }
  $('#sample').value=S.sample; $('#fS').classList.toggle('has',!!S.sample);
  $('#size').value=S.size; $('#sizeV').textContent=S.size; document.documentElement.style.setProperty('--pvs',S.size+'px');

}
/* ---------- font loading ---------- */
const loaded=new Set(); let gQueue=[], gTimer=null;
function wantFont(f){
  if(loaded.has(f.id)) return; loaded.add(f.id);
  if(f.s==='g'){ gQueue.push(f); clearTimeout(gTimer); gTimer=setTimeout(flushG,40); }
  else if(f.s==='a' && S.adobeOn && f.kt!=null){ loadAKit(f.kt); }
  else if(f.s==='k' && f.ff){ const st=document.createElement('style'); st.textContent=kCss(f); document.head.appendChild(st); }
}
function flushG(){
  const batch=gQueue.splice(0); for(let i=0;i<batch.length;i+=12){
    const fams=batch.slice(i,i+12).map(f=>{ const w=f._w||400; return 'family='+encodeURIComponent(f.n).replace(/%20/g,'+')+':wght@'+w; });
    const l=document.createElement('link'); l.rel='stylesheet'; l.href='https://fonts.googleapis.com/css2?'+fams.join('&')+'&display=swap'; document.head.appendChild(l);
  }
}
function kCss(f){ return (f.ff||[]).map(([u,w,st])=>{ const url=u.startsWith('~')?'https://cdn.jsdelivr.net/gh/projectnoonnu/'+u.slice(1):u; const fmt=/woff2$/.test(url)?'woff2':/woff$/.test(url)?'woff':/otf$/.test(url)?'opentype':'truetype'; return `@font-face{font-family:'${f.cf}';src:url('${url}') format('${fmt}');font-weight:${w};${st?'font-style:'+st+';':''}font-display:swap;}`; }).join('\n'); }
function famCss(f){
  if(f.s==='g') return `'${f.n}'`;
  if(f.s==='k') return `'${f.cf}'`;
  if(f.s==='a') return `'${f.cf||f.id.slice(2)}'`;
}
function canPreview(f){ return f.s!=='a' || (S.adobeOn && f.kt!=null) || S.kitFams.has(f.id.slice(2)); }
const akLoaded={}; let akChain=Promise.resolve();
function loadAKit(i){
  const id=S.akits[i]; if(!id||akLoaded[id]) return; akLoaded[id]=1;
  akChain=akChain.then(()=>new Promise(res=>{ const s=document.createElement('script'); s.src='https://use.typekit.net/'+id+'.js'; s.onload=()=>{ try{ Typekit.load({async:true,active:res,inactive:res}); }catch(e){res()} setTimeout(res,4000); }; s.onerror=res; document.head.appendChild(s); }).then(()=>fixKit(i)));
}
const tokn=x=>String(x).toLowerCase().split(/[^a-z0-9]+/).filter(Boolean).sort().join('-');
function fixKit(i){
  const fams=new Set(); document.fonts.forEach(ff=>fams.add(ff.family.replace(/["']/g,'')));
  const byTok={}; fams.forEach(n=>byTok[tokn(n)]=n);
  S.data.forEach(f=>{ if(f.s!=='a'||f.kt!==i||fams.has(f.cf)) return; const m=byTok[tokn(f.cf)]||byTok[tokn(f.cf).replace(/(^|-)\d+(-|$)/g,'$1').replace(/^-|-$/g,'')]; if(m){ f.cf=m; document.querySelectorAll(`.card[data-id="${CSS.escape(f.id)}"] .pv:not(.nopv)`).forEach(p=>p.style.fontFamily=`'${m}','Asta Sans'`); } });
}
function pvText(f){
  if(S.sample) return S.sample;
  return (f.sc||[]).includes('ko') ? DEF_KO : DEF_LA;
}
function loadKits(){
  (S.cfg.kits||[]).forEach(k=>{ if(!k) return; if(document.getElementById('kit_'+k)) return; const l=document.createElement('link'); l.id='kit_'+k; l.rel='stylesheet'; l.href='https://use.typekit.net/'+k+'.css'; document.head.appendChild(l); });
}
async function refreshKitFams(){
  const set=new Set();
  for(const k of (S.cfg.kits||[])){ if(!k) continue; try{ const t=await (await fetch('https://use.typekit.net/'+k+'.css')).text(); [...t.matchAll(/font-family:\s*"([^"]+)"/g)].forEach(m=>set.add(m[1])); }catch(e){} }
  // map css family names back to slugs
  const out=new Set(); S.data.forEach(f=>{ if(f.s==='a' && (set.has(f.wn)||set.has(f.id.slice(2)))) out.add(f.id.slice(2)); });
  S.kitFams=out; SS('kitFams',[...out]); return out.size;
}

/* ---------- filtering ---------- */
function baseFilter(f, skip){
  if(S.src!=='all' && f.s!==S.src) return false;
  if(skip!=='major' && S.major && f.m!==S.major) return false;
  if(skip!=='major' && S.subs.size && !(f.sb||[]).some(s=>S.subs.has(s))) return false;
  if(skip!=='era' && S.era && f.e!==S.era) return false;
  if(skip!=='mood' && S.mood && !(f.mo||[]).includes(S.mood)) return false;
  const o=S.opt;
  if(o.ko && !(f.sc||[]).includes('ko')) return false;
  if(o.lat && (f.x || !(f.sc||[]).some(x=>x==='la'||x==='ko'))) return false;
  if(o.vf && !f.v) return false;
  if(o.pv && !canPreview(f)) return false;
  if(o.com && f.s==='k' && !(f.lc&&f.lc.p==='o'&&f.lc.v==='o'&&f.lc.b==='o')) return false;
  if(S.q){ const qs=S.q.toLowerCase().split(/\s+/).filter(Boolean); if(!qs.every(x=>f._q.includes(x))) return false; }
  return true;
}
function sorted(list){
  const s=S.sort;
  if(s==='name') return list.sort((a,b)=>a.n.localeCompare(b.n,'ko'));
  if(s==='new') return list.sort((a,b)=>(b.da||'').localeCompare(a.da||''));
  if(s==='era') return list.sort((a,b)=>(ERA_IDX[a.e]-ERA_IDX[b.e])||((a.y||9999)-(b.y||9999)));
  if(s==='pop') return list.sort((a,b)=>(b.pop||0)-(a.pop||0));
  if(s==='wt') return list.sort((a,b)=>(b.w||0)-(a.w||0));
  // rel: Korean-first when sample has hangul, previewable first, then popularity/order
  const hk=/[가-힣]/.test(S.sample);
  return list.sort((a,b)=>{
    const pa=canPreview(a)?0:1, pb=canPreview(b)?0:1; if(pa!==pb) return pa-pb;
    if(hk){ const ka=(a.sc||[]).includes('ko')?0:1, kb=(b.sc||[]).includes('ko')?0:1; if(ka!==kb) return ka-kb; }
    return (b.r||0)-(a.r||0) || a._i-b._i;
  });
}

/* ---------- filter UI ---------- */
function cnt(fn){ let n=0; for(const f of S.data) if(fn(f)) n++; return n; }
function renderFilters(){
  const el=$('#filters');

    `</div><button class="chip" id="optBtn" style="margin-left:6px">${ICON.filter.replace('class="i"','class="i" style="width:14px;height:14px;vertical-align:-2px;margin-right:3px"')}옵션${optCount()?' · '+optCount():''}</button></div>`;
  h+=`<div class="chipsrow"><span class="lbl">TYPE</span><button class="chip ${!S.major?'on':''}" data-major="">전체</button>`+

  if(S.major){
    const sc={}; base.filter(f=>f.m===S.major).forEach(f=>(f.sb||[]).forEach(s=>sc[s]=(sc[s]||0)+1));
    const subs=Object.keys(sc).filter(s=>SUB[s]&&sc[s]>=2).sort((a,b)=>sc[b]-sc[a]);
    if(subs.length) h+=`<div class="chipsrow"><span class="lbl">STYLE</span>`+subs.map(s=>`<button class="chip sub ${S.subs.has(s)?'on':''}" data-sub="${s}">${SUB[s]}<span class="n">${sc[s]}</span></button>`).join('')+`</div>`;
  }
  if(S.tab==='browse'){
    const eb=S.data.filter(f=>baseFilter(f,'era')); const ec={}; eb.forEach(f=>ec[f.e]=(ec[f.e]||0)+1);
    h+=`<div class="chipsrow"><span class="lbl">ERA</span><button class="chip ${!S.era?'on':''}" data-era="">전체</button>`+ERAS.filter(e=>ec[e[0]]).map(e=>`<button class="chip ${S.era===e[0]?'on':''}" data-era="${e[0]}">${e[1]}<span class="n">${ec[e[0]]}</span></button>`).join('')+`</div>`;
  }
  const mb=S.data.filter(f=>baseFilter(f,'mood')); const moc={}; mb.forEach(f=>(f.mo||[]).forEach(m=>moc[m]=(moc[m]||0)+1));

  el.innerHTML=h;

function optCount(){ const o=S.opt; return ['ko','pv','vf','com'].filter(k=>o[k]).length + (o.lat?0:1); }

/* ---------- main render ---------- */
let curList=[];
function render(keepShown){
  if(!keepShown) S.shown=60;
  $('#toolArea').style.display = S.tab==='saved' ? 'none' : '';
  $('#eraArea').style.display = S.tab==='era' ? '' : 'none';
  $('#favTop').style.display = S.tab==='saved' ? '' : 'none';
  $('#favCnt').textContent=Object.keys(S.favs).length;
  if(S.tab==='saved') return renderSaved();
  if(S.tab==='era') renderEraArea();
  curList=sorted(S.data.filter(f=>baseFilter(f)));
  $('#metaRow').style.display='';
  $('#count').innerHTML=`<b>${curList.length.toLocaleString()}</b>개 폰트`+(S.era&&S.tab==='era'?` · ${ERAS[ERA_IDX[S.era]][1]}`:'');
  drawCards(curList.slice(0,S.shown), $('#out'), curList.length>S.shown);
}
function cardHTML(f){
  const fav=S.favs[f.id]; const pv=canPreview(f);
  const era=ERAS[ERA_IDX[f.e]];
  const sub=[f.fo||f.d].filter(Boolean).join(' · ');
  const tags=[`<span class="tg"><span class="src-dot s${f.s}"></span>${SRC[f.s]}</span>`, `<span class="tg">${MAJOR[f.m]||''}</span>`]
    .concat((f.sb||[]).slice(0,2).filter(s=>SUB[s]).map(s=>`<span class="tg">${SUB[s]}</span>`))
    .concat([`<span class="tg era">${era?era[1]:''}${f.y&&f.eh!=='style'?' · '+(f.y<1000?'고대':f.y):''}</span>`])
    .concat(f.w>1?[`<span class="tg mono">${f.w}W</span>`]:[]).concat(f.v?[`<span class="tg mono">VAR</span>`]:[]);
  const prev = pv ? `<div class="pv" style="font-family:${esc(famCss(f))},'Asta Sans';${f._w?'font-weight:'+f._w:''}">${esc(pvText(f))}</div>`
    : (f.kt!=null ? `<div class="pv nopv"><div class="ph">Adobe 폰트 미리보기가 꺼져 있어요 <button class="btn" data-adobeon="1" style="height:30px;margin-left:6px">켜기</button></div></div>`
      : `<div class="pv nopv"><div class="ph">미리보기 준비 안 된 Adobe 폰트 · 탭해서 Adobe에서 보기</div></div>`);
  return `<div class="card" data-id="${esc(f.id)}"><div class="top"><div style="flex:1;min-width:0"><div class="nm">${esc(f.n)}</div><div class="sub2">${esc(sub)}</div></div><button class="star ${fav?'on':''}" data-star="${esc(f.id)}" title="즐겨찾기">${ICON.star}</button></div>${prev}<div class="tags">${tags.join('')}</div>${fav&&fav.m?`<div class="memo">${esc(fav.m)}</div>`:''}</div>`;
}
let io=null;
function drawCards(list, el, hasMore){
  if(!list.length){ el.innerHTML='<div class="empty">조건에 맞는 폰트가 없어요.<br>필터를 줄여보세요.</div>'; return; }
  el.innerHTML=`<div class="grid ${S.view==='list'?'list':''}">${list.map(cardHTML).join('')}</div>`+(hasMore?`<div class="more" id="moreS"><button class="btn" id="moreB">더 보기</button></div>`:'');
  observe(el);
  const m=$('#moreS'); if(m){ const o=new IntersectionObserver(es=>{ if(es[0].isIntersecting){ o.disconnect(); S.shown+=60; appendMore(); } },{rootMargin:'600px'}); o.observe(m); }
}
function appendMore(){
  const grid=$('#out .grid'); if(!grid) return;
  const from=grid.children.length; const chunk=curList.slice(from,S.shown);
  grid.insertAdjacentHTML('beforeend',chunk.map(cardHTML).join(''));
  observe($('#out'));
  const m=$('#moreS'); if(curList.length<=S.shown){ m&&m.remove(); } else { const o=new IntersectionObserver(es=>{ if(es[0].isIntersecting){ o.disconnect(); S.shown+=60; appendMore(); } },{rootMargin:'600px'}); o.observe(m); }
}
function observe(root){
  if(!io) io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ const f=S.byId[e.target.dataset.id]; if(f){ wantFont(f); const pv=e.target.querySelector('.pv:not(.nopv)'); if(pv&&f._w) pv.style.fontWeight=f._w; } io.unobserve(e.target);} }),{rootMargin:'300px'});
  root.querySelectorAll('.card').forEach(c=>io.observe(c));
}
function updatePreviews(){
  document.querySelectorAll('.card .pv:not(.nopv)').forEach(p=>{ const f=S.byId[p.closest('.card').dataset.id]; p.textContent=pvText(f); });
  const d=$('#dpv'); if(d){ const f=S.byId[d.dataset.id]; d.textContent=pvText(f); document.querySelectorAll('#wts div span').forEach(s=>s.textContent=pvText(f)); }
}

/* ---------- ERA ---------- */
function renderEraArea(){

/* ---------- sync (Google Sheet via Apps Script) ---------- */
function enqueue(op){ S.queue.push(op); SS('queue',S.queue); setPending(); flush(); }
function setPending(){ $('#bSync').classList.toggle('pending',S.queue.length>0); }
let flushing=false;
async function flush(){
  if(flushing||!S.cfg.api||!S.queue.length) return; flushing=true;
  try{
    while(S.queue.length){
      const batch=S.queue.slice(0,30);
      const r=await fetch(S.cfg.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:S.cfg.token||'',ops:batch})});
      const j=await r.json(); if(!j.ok) throw new Error(j.error||'sync');
      S.queue.splice(0,batch.length); SS('queue',S.queue);
    }
  }catch(e){ console.warn('sync fail',e); setTimeout(()=>{flushing=false;flush()},15000); setPending(); return; }
  flushing=false; setPending();
}
async function pull(manual){
  if(!S.cfg.api){ if(manual) toast('설정에서 시트 연결 주소를 넣어주세요'); return; }
  const b=$('#bSync'); b.classList.add('spin');
  try{
    await flush();
    const j=await (await fetch(S.cfg.api+'?action=all&token='+encodeURIComponent(S.cfg.token||''))).json();
    if(j.ok){
      if(!S.queue.length){
        const favs={}; (j.favs||[]).forEach(r=>{ if(r.id) favs[r.id]={f:String(r.f||'').split(',').map(s=>s.trim()).filter(Boolean),m:r.m||'',t:r.t||''}; });
        S.favs=favs; SS('favs',favs);
        if(j.folders&&j.folders.length){ S.folders=j.folders; SS('folders',S.folders); }
        if(j.kits){ S.cfg.kits=j.kits; SS('cfg',S.cfg); loadKits(); await refreshKitFams(); }
        if(j.sheet){ S.cfg.sheet=j.sheet; SS('cfg',S.cfg); updSheetBtn(); }
      }
      render(true); if(manual) toast('동기화 완료');
    } else if(manual) toast('동기화 실패: '+(j.error||''));
  }catch(e){ if(manual) toast('동기화 실패 — 네트워크 확인'); }
  b.classList.remove('spin');
}

  if(d.t){ S.tab=d.t; document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b===t)); if(S.tab!=='era'&&S.tab!=='browse'){} renderFilters(); render(); window.scrollTo(0,0); return; }
  if(d.src!==undefined){ S.src=d.src; S.major=null; S.subs.clear(); renderFilters(); render(); return; }
  if(d.major!==undefined){ S.major=d.major||null; S.subs.clear(); renderFilters(); render(); return; }
  if(d.sub){ S.subs.has(d.sub)?S.subs.delete(d.sub):S.subs.add(d.sub); renderFilters(); render(); return; }
  if(d.era!==undefined){ S.era=(S.tab==='era'&&S.era===d.era)?null:(d.era||null); renderFilters(); render(); return; }
  if(d.mood!==undefined){ S.mood=d.mood||null; renderFilters(); render(); return; }
  if(d.v){ S.view=d.v; SS('view',S.view); document.querySelectorAll('.vbtn').forEach(b=>b.classList.toggle('on',b===t)); render(true); return; }
  if(d.adobeon){ e.stopPropagation(); S.adobeOn=true; SS('adobeOn',true); loaded.clear(); render(true); toast('Adobe 미리보기 켜짐'); return; }
  if(d.star){ e.stopPropagation(); openFav(d.star); return; }
  if(d.close!==undefined){ closeOv(); return; }
  if(d.copy){ navigator.clipboard?.writeText(d.copy); toast('이름 복사됨'); return; }
  if(d.copycss){ navigator.clipboard?.writeText(kCss(S.byId[d.copycss])); toast('CSS 복사됨'); return; }
  if(d.fm){ S.favMode=d.fm; SS('favMode',S.favMode); renderSaved(); return; }
  if(d.ff!==undefined){ S.favFolder=d.ff||null; renderSaved(); return; }
  if(d.fren){ const nv=prompt('폴더 이름',d.fren); if(nv&&nv.trim()&&!S.folders.includes(nv.trim())){ const o=d.fren,n=nv.trim(); S.folders=S.folders.map(x=>x===o?n:x); saveFolders(); Object.keys(S.favs).forEach(id=>{ const v=S.favs[id]; if((v.f||[]).includes(o)){ setFav(id,{...v,f:v.f.map(x=>x===o?n:x)}); } }); if(S.favFolder===o) S.favFolder=n; renderSaved(); } return; }
  if(d.fdel){ if(confirm(`'${d.fdel}' 폴더를 삭제할까요? (폰트는 즐겨찾기에 남아요)`)){ const o=d.fdel; S.folders=S.folders.filter(x=>x!==o); saveFolders(); Object.keys(S.favs).forEach(id=>{ const v=S.favs[id]; if((v.f||[]).includes(o)) setFav(id,{...v,f:v.f.filter(x=>x!==o)}); }); S.favFolder=null; renderSaved(); } return; }
  if(d.fup){ const i=S.folders.indexOf(d.fup); if(i>0){ [S.folders[i-1],S.folders[i]]=[S.folders[i],S.folders[i-1]]; saveFolders(); renderSaved(); } return; }
  if(t.id==='newFolder'){ const v=prompt('새 폴더 이름'); if(v&&v.trim()&&!S.folders.includes(v.trim())){ S.folders.push(v.trim()); saveFolders(); renderSaved(); } return; }
  if(t.id==='optBtn'){ openOpts(); return; }
  if(t.id==='bSet'){ openSettings(); return; }
  if(t.id==='bSync'){ pull(true); return; }
  if(t.id==='moreB'){ S.shown+=60; appendMore(); return; }
  if(t.classList.contains('card')){ openDetail(d.id); return; }
});
document.addEventListener('change',e=>{ const k=e.target.dataset.opt; if(k){ S.opt[k]=e.target.checked; SS('opt',S.opt); renderFilters(); render(); } });
document.addEventListener('input',e=>{ if(e.target.id==='sample2'){ S.sample=e.target.value; SS('sample',S.sample); $('#sample').value=S.sample; updatePreviews(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeOv(); });
window.addEventListener('online',flush);
setPending();
load();
</script>
</body>
</html>
